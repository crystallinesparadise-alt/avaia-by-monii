<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout — Avaia By Monii</title><link rel="stylesheet" href="/styles.css"></head>
<body><header><div class="container nav"><a class="logo" href="/">AVAIA BY MONII</a><a href="/cart.html">Back to bag</a></div></header>
<main class="page"><div class="container grid-2"><div><div class="eyebrow">Secure checkout</div><h1 style="font-size:56px">Your details</h1><form class="form" id="checkout"><div class="field"><label>Full name</label><input name="name" required></div><div class="field"><label>Email</label><input name="email" type="email" required></div><div class="field"><label>Phone</label><input name="phone" required></div><div class="field"><label>Address</label><textarea name="address" required></textarea></div><div class="grid-2"><div class="field"><label>City</label><input name="city" required></div><div class="field"><label>State</label><input name="state" required></div></div><div class="field"><label>Delivery method</label><select name="deliveryMethod"><option>Delivery</option><option>Pickup</option></select></div><div class="field"><label>Order note (optional)</label><textarea name="notes"></textarea></div><button class="btn">Continue to payment</button><div id="msg"></div></form></div><div class="panel"><h2>Order summary</h2><div id="summary"></div></div></div></main>
<script src="/app.js"></script><script>
const c=getCart();if(!c.length)location.href="/cart.html";document.getElementById("summary").innerHTML=c.map(x=>`<p>${x.name} × ${x.quantity}<br><strong>${money(x.price*x.quantity)}</strong></p>`).join("")+`<hr><strong>Total: ${money(c.reduce((a,x)=>a+x.price*x.quantity,0))}</strong>`;
document.getElementById("checkout").onsubmit=async e=>{e.preventDefault();const customer=Object.fromEntries(new FormData(e.target));customer.deliveryFee=0;const items=c.map(x=>({productId:x.productId,quantity:x.quantity}));const msg=document.getElementById("msg");msg.textContent="Creating your order…";const r=await fetch("/api/orders",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({customer,items})});const data=await r.json();if(!r.ok){msg.textContent=data.error||"Something went wrong.";return}localStorage.removeItem(cartKey);if(data.authorizationUrl){location.href=data.authorizationUrl}else{location.href="/order.html?order="+encodeURIComponent(data.orderNumber)+"&status=demo"}}
</script></body></html>
