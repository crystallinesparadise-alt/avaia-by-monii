<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Track Order — Avaia By Monii</title><link rel="stylesheet" href="/styles.css"></head>
<body><header><div class="container nav"><a class="logo" href="/">AVAIA BY MONII</a><a href="/shop.html">Shop</a></div></header>
<main class="page"><div class="container" style="max-width:620px"><div class="eyebrow">Order tracking</div><h1 style="font-size:55px">Where is my order?</h1><form class="form" id="track"><div class="field"><label>Order number</label><input name="order" placeholder="AVM-123456" required></div><div class="field"><label>Checkout email</label><input name="email" type="email" required></div><button class="btn">Track order</button></form><div id="result" style="margin-top:20px"></div></div></main>
<script>document.getElementById("track").onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));const r=await fetch("/api/orders/track?order="+encodeURIComponent(d.order)+"&email="+encodeURIComponent(d.email));const x=await r.json();document.getElementById("result").innerHTML=r.ok?`<div class="panel"><h2>${x.order_number}</h2><p>Customer: ${x.customer_name}</p><p>Status: <span class="status">${x.status}</span></p><p>Payment: ${x.payment_status}</p><p>Total: ₦${Number(x.total).toLocaleString("en-NG")}</p></div>`:`<div class="notice">${x.error}</div>`}</script></body></html>
