<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your Bag — Avaia By Monii</title><link rel="stylesheet" href="/styles.css"></head>
<body><header><div class="container nav"><a class="logo" href="/">AVAIA BY MONII</a><a class="pill" href="/shop.html">Continue shopping</a></div></header>
<main class="page"><div class="container"><div class="eyebrow">Your selection</div><h1 style="font-size:58px">Your Bag</h1><div id="cart"></div></div></main>
<script src="/app.js"></script><script>
function render(){const c=getCart(),el=document.getElementById("cart");if(!c.length){el.innerHTML='<div class="notice">Your bag is empty.</div><a class="btn" href="/shop.html">Shop now</a>';return}let total=c.reduce((a,x)=>a+x.price*x.quantity,0);el.innerHTML=`<div class="table-wrap"><table class="table"><tr><th>Item</th><th>Qty</th><th>Price</th><th></th></tr>${c.map((x,i)=>`<tr><td>${x.name}</td><td>${x.quantity}</td><td>${money(x.price*x.quantity)}</td><td><button class="pill" onclick="removeItem(${i})">Remove</button></td></tr>`).join("")}</table></div><div style="display:flex;justify-content:space-between;align-items:center;margin-top:20px"><strong>Total: ${money(total)}</strong><a class="btn" href="/checkout.html">Checkout</a></div>`}function removeItem(i){const c=getCart();c.splice(i,1);setCart(c);render()}render()
</script></body></html>
