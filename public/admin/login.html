<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login — Avaia By Monii</title><link rel="stylesheet" href="/styles.css"></head>
<body class="login"><div class="login-box"><div class="eyebrow">Private dashboard</div><h1 style="font-size:44px">Avaia Admin</h1><form class="form" id="login"><div class="field"><label>Email</label><input name="email" type="email" required></div><div class="field"><label>Password</label><input name="password" type="password" required></div><button class="btn">Sign in</button><div id="msg"></div></form></div><script>document.getElementById("login").onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));const r=await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(d)});if(r.ok)location.href="/admin/index.html";else document.getElementById("msg").textContent=(await r.json()).error}</script></body></html>
