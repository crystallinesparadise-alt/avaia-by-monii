<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard — Avaia By Monii</title><link rel="stylesheet" href="/styles.css"></head>
<body class="admin-shell"><div class="admin-top"><div class="container admin-nav"><strong>AVAIA ADMIN</strong><div><a href="/" style="margin-right:18px">Store</a><button class="pill" style="color:white;border-color:#777" onclick="logout()">Log out</button></div></div></div>
<main class="admin-main"><div class="container"><div class="metrics" id="metrics"></div><div class="admin-grid"><div class="panel"><div class="section-head"><div><div class="eyebrow">Orders</div><h2>Recent orders</h2></div><span id="pendingBadge" class="status"></span></div><div class="table-wrap"><table class="table" id="orders"></table></div></div><div class="panel"><div class="eyebrow">Notifications</div><h2>Revenue activity</h2><div id="notifications"></div></div></div>
<div class="admin-grid"><div class="panel"><div class="section-head"><div><div class="eyebrow">Inventory</div><h2>Products</h2></div></div><div class="table-wrap"><table class="table" id="products"></table></div></div><div class="panel"><div class="eyebrow">Expenses</div><h2>Add expense</h2><form class="form" id="expense"><input name="title" placeholder="e.g. Packaging" required><input name="category" placeholder="Category" required><input name="amount" type="number" min="1" placeholder="Amount (₦)" required><textarea name="note" placeholder="Note"></textarea><button class="btn">Save expense</button></form><div id="expenseMsg"></div></div></div></div></main>
<script>
const money=n=>`₦${Number(n||0).toLocaleString("en-NG")}`;
async function api(url,opt){const r=await fetch(url,opt);if(r.status===401){location.href="/admin/login.html";throw 0}const d=await r.json();if(!r.ok)throw new Error(d.error||"Error");return d}
async function load(){const d=await api("/api/admin/dashboard");document.getElementById("metrics").innerHTML=[
["Revenue",money(d.revenue)],["Product profit",money(d.paidProfit)],["Net profit",money(d.netProfit)],["Pending orders",d.pending]
].map(x=>`<div class="metric"><small>${x[0]}</small><strong>${x[1]}</strong></div>`).join("");
document.getElementById("pendingBadge").textContent=`${d.pending} pending`;
document.getElementById("orders").innerHTML=`<tr><th>Order</th><th>Customer</th><th>Total</th><th>Status</th><th>Payment</th><th>Action</th></tr>`+d.recent.map(o=>`<tr><td>${o.order_number}</td><td>${o.customer_name}</td><td>${money(o.total)}</td><td><select onchange="changeStatus(${o.id},this.value)">${["pending_payment","processing","ready_for_pickup","shipped","delivered","cancelled"].map(s=>`<option ${s===o.status?"selected":""}>${s}</option>`).join("")}</select></td><td>${o.payment_status}</td><td>—</td></tr>`).join("");
const p=await api("/api/admin/products");document.getElementById("products").innerHTML=`<tr><th>Product</th><th>Sell</th><th>Cost</th><th>Profit</th><th>Stock</th></tr>`+p.map(x=>`<tr><td>${x.name}</td><td>${money(x.price)}</td><td>${money(x.cost_price)}</td><td>${money(x.price-x.cost_price)}</td><td>${x.stock}${x.stock<=x.low_stock_threshold?" ⚠️":""}</td></tr>`).join("");
const n=await api("/api/admin/notifications");document.getElementById("notifications").innerHTML=n.length?n.slice(0,10).map(x=>`<div style="padding:12px 0;border-bottom:1px solid var(--line)"><strong>${x.title}</strong><br><span class="muted">${x.message}</span></div>`).join(""):"<p class='muted'>No revenue notifications yet.</p>";
}
async function changeStatus(id,status){await api("/api/admin/orders/"+id,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({status})});load()}
async function logout(){await fetch("/api/admin/logout",{method:"POST"});location.href="/admin/login.html"}
document.getElementById("expense").onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));try{await api("/api/admin/expenses",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(d)});e.target.reset();document.getElementById("expenseMsg").textContent="Expense saved.";load()}catch(x){document.getElementById("expenseMsg").textContent=x.message}}
load();
</script></body></html>
