<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product — Avaia By Monii</title><link rel="stylesheet" href="/styles.css"></head>
<body><header><div class="container nav"><a class="logo" href="/">AVAIA BY MONII</a><nav class="navlinks"><a href="/shop.html">Shop</a><a href="/track.html">Track Order</a></nav><a class="pill" href="/cart.html">Bag (<span data-cart-count>0</span>)</a></div></header>
<main class="page"><div class="container product-detail" id="detail"></div></main>
<script src="/app.js"></script><script>
(async()=>{const slug=new URLSearchParams(location.search).get("slug");const r=await fetch("/api/products/"+encodeURIComponent(slug));const p=await r.json();document.title=p.name+" — Avaia By Monii";document.getElementById("detail").innerHTML=`<div class="detail-image"></div><div class="detail"><div class="eyebrow">${p.category}</div><h1>${p.name}</h1><div class="price">${money(p.price)}</div><p>${p.description}</p><p class="muted">${p.stock} available</p><div class="form"><div class="field"><label>Quantity</label><input id="qty" type="number" min="1" max="${p.stock}" value="1"></div><button class="btn" id="add">Add to bag</button><a class="btn light" href="/cart.html">Go to checkout</a></div></div>`;document.getElementById("add").onclick=()=>addToCart(p,Number(document.getElementById("qty").value));})();
</script></body></html>
